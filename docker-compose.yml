version: '3.8'

services:
  memento-mcp-server:
    extends:
      file: docker-compose.base.yml
      service: memento-base
    environment:
      NODE_ENV: production
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-9001}
      PORT: ${PORT:-9001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${MCP_SERVER_PORT:-9001}:${MCP_SERVER_PORT:-9001}"
    user: root
    command: ["/app/start-container.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MCP_SERVER_PORT:-9001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Memento Agent (Actionable Memory Assistant)
  memento-agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      MEMENTO_BASE_URL: http://memento-mcp-server:${MCP_SERVER_PORT:-9001}
      AGENT_PORT: ${AGENT_PORT:-3001}
    ports:
      - "${AGENT_PORT:-3001}:3001"
    depends_on:
      memento-mcp-server:
        condition: service_healthy
    restart: unless-stopped

  # Redis for caching (optional)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes

volumes:
  redis_data:
