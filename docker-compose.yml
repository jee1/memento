version: '3.8'

services:
  memento-base:
    profiles:
      - base-only
    extends:
      file: docker-compose.base.yml
      service: memento-base

  memento-mcp-server:
    extends:
      file: docker-compose.base.yml
      service: memento-base
    environment:
      NODE_ENV: production
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-9001}
      PORT: ${PORT:-9001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEMENTO_ALLOW_INSECURE_HTTP_ADMIN: ${MEMENTO_ALLOW_INSECURE_HTTP_ADMIN:-false}
    # 게시 주소 기본값은 루프백이다. 컨테이너 안 MEMENTO_HTTP_BIND_HOST 는 0.0.0.0 이어야
    # 도커 게시가 프로세스에 닿으므로(docker-compose.base.yml), 외부 노출 여부를 정하는 것은
    # 이 한 줄뿐이다. 전에는 0.0.0.0 게시라 LAN 의 누구나 /tools·/mcp 에 도달할 수 있었다.
    # LAN·원격 노출이 필요하면 .env 에 MCP_PUBLISH_HOST=0.0.0.0 을 두고
    # MEMENTO_API_TOKENS 를 반드시 함께 설정한다.
    ports:
      - "${MCP_PUBLISH_HOST:-127.0.0.1}:${MCP_SERVER_PORT:-9001}:${MCP_SERVER_PORT:-9001}"
    command: ["/app/start-container.sh"]
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:${MCP_SERVER_PORT:-9001}/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => { process.exit(1); });"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching (optional)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes

volumes:
  redis_data:
