# Production Docker Compose — secrets 예시 (#670)
#
# 사용법:
#   1. ./secrets/ 디렉터리에 실제 값 파일 생성 (git 제외)
#   2. docker compose -f docker-compose.prod.yml -f docker-compose.prod.secrets.example.yml up -d
#
# 주의: 아래 YAML에는 평문 API 키가 없습니다. secrets/*.txt 는 로컬에서만 생성하세요.

services:
  memento-prod:
    secrets:
      - openai_api_key
      - gemini_api_key
      - memento_api_tokens
    environment:
      # entrypoint/start-container.sh 에서 /run/secrets/* 를 읽어 주입하는 것을 권장합니다.
      # 평문 키를 environment: 에 직접 넣지 마세요.
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      MEMENTO_API_TOKENS_FILE: /run/secrets/memento_api_tokens

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  memento_api_tokens:
    file: ./secrets/memento_api_tokens.json
