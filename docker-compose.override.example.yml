version: '3.8'

services:
  memento-mcp-server:
    environment:
      # 공통 진단 설정
      DIAGNOSTICS_ENABLED: "true"
      DIAGNOSTICS_INTERVAL_MS: "10000"

      # 프로파일 1: 기준선 (모든 기능 on)
      BATCH_SCHEDULER_ENABLED: "true"
      WAL_CHECKPOINT_ENABLED: "true"
      DB_LOCK_MONITOR_ENABLED: "true"

      # 프로파일 2: 배치 차단
      # BATCH_SCHEDULER_ENABLED: "false"
      # WAL_CHECKPOINT_ENABLED: "true"
      # DB_LOCK_MONITOR_ENABLED: "true"

      # 프로파일 3: DB 모니터 차단
      # BATCH_SCHEDULER_ENABLED: "true"
      # WAL_CHECKPOINT_ENABLED: "false"
      # DB_LOCK_MONITOR_ENABLED: "false"

      # 프로파일 4: 전부 차단
      # BATCH_SCHEDULER_ENABLED: "false"
      # WAL_CHECKPOINT_ENABLED: "false"
      # DB_LOCK_MONITOR_ENABLED: "false"
