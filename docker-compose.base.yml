version: '3.8'

x-default-environment: &default-environment
  DOCKER: 'true'
  MCP_SERVER_NAME: ${MCP_SERVER_NAME:-memento-memory}
  MCP_SERVER_VERSION: ${MCP_SERVER_VERSION:-0.1.0}
  DB_PATH: "/app/data/memory.db"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FILE: ${LOG_FILE:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-minilm}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-text-embedding-3-small}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-text-embedding-004}
  SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-10}
  SEARCH_MAX_LIMIT: ${SEARCH_MAX_LIMIT:-50}
  # .env의 ADMIN_API_KEY를 컨테이너에 주입 (미설정 시 빈 값 — admin 라우트는 401)
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  FORGET_WORKING_TTL: ${FORGET_WORKING_TTL:-48}
  FORGET_EPISODIC_TTL: ${FORGET_EPISODIC_TTL:-2160}
  FORGET_SEMANTIC_TTL: ${FORGET_SEMANTIC_TTL:--1}
  FORGET_PROCEDURAL_TTL: ${FORGET_PROCEDURAL_TTL:--1}
  # Docker 컨테이너에서는 반드시 0.0.0.0 — 로컬 .env의 값을 무시하고 고정
  MEMENTO_HTTP_BIND_HOST: "0.0.0.0"
  # MEMENTO_ALLOW_INSECURE_HTTP_ADMIN 은 기본값 false 로 설정됨.
  # 보안 체크 우회가 필요한 경우 uncommitted docker-compose.override.yml 에서만 설정할 것.
  # SSE 전송 방식 사용 (HTTP/SSE 서버 모드)
  TRANSPORT_TYPE: ${TRANSPORT_TYPE:-sse}

services:
  memento-base:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *default-environment
    volumes:
      - ${HOME}/.memento/data:/app/data
      - ${HOME}/.memento/logs:/app/logs
    restart: unless-stopped
    stdin_open: true
    tty: true
