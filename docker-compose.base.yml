version: '3.8'

x-default-environment: &default-environment
  DOCKER: 'true'
  # MCP_SERVER_NAME / MCP_SERVER_VERSION 은 여기서 주지 않습니다. 패키지 매니페스트가 단일 출처입니다 (#1077).
  # 환경변수로 주면 배포본이 실제 발행 버전과 다른 값을 /health 에 보고합니다.
  DB_PATH: "/app/data/memory.db"
  MEMENTO_CONFIG_DIR: "/app/.memento"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FILE: ${LOG_FILE:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-minilm}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-text-embedding-3-small}
  # LLM 제공자 및 모델 설정 (임베딩과 분리)
  # OPENAI_MODEL  → 임베딩 전용 (text-embedding-*)
  # OPENAI_LLM_MODEL → 추출·요약 등 LLM 호출 전용 (gpt-4o, gpt-4o-mini 등)
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o-mini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-text-embedding-004}
  GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-2.0-flash}
  # 용도별 LLM provider override (미설정·빈 값 → 전역 LLM_PROVIDER; #820)
  LLM_PROVIDER_TRIPLE_EXTRACTION: ${LLM_PROVIDER_TRIPLE_EXTRACTION:-}
  LLM_PROVIDER_RELATION_EXTRACTION: ${LLM_PROVIDER_RELATION_EXTRACTION:-}
  LLM_PROVIDER_PROCEDURAL: ${LLM_PROVIDER_PROCEDURAL:-}
  # 용도별 LLM 모델 override (설정 시 provider default보다 우선; bound provider와 일치할 때만)
  LLM_MODEL_TRIPLE_EXTRACTION: ${LLM_MODEL_TRIPLE_EXTRACTION:-}
  LLM_MODEL_RELATION_EXTRACTION: ${LLM_MODEL_RELATION_EXTRACTION:-}
  LLM_MODEL_PROCEDURAL: ${LLM_MODEL_PROCEDURAL:-}
  LLM_MODEL_CONSOLIDATION: ${LLM_MODEL_CONSOLIDATION:-}
  SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-10}
  SEARCH_MAX_LIMIT: ${SEARCH_MAX_LIMIT:-50}
  # 검색 기각 게이트 (#1095). 기본 off — .env 에서 켜지 않으면 동작이 바뀌지 않는다.
  SEARCH_REJECTION_GATE: ${SEARCH_REJECTION_GATE:-off}
  SEARCH_REJECTION_GATE_THRESHOLD: ${SEARCH_REJECTION_GATE_THRESHOLD:-0.5}
  SEARCH_REJECTION_GATE_TIMEOUT_MS: ${SEARCH_REJECTION_GATE_TIMEOUT_MS:-1500}
  SEARCH_REJECTION_GATE_DOC_CHARS: ${SEARCH_REJECTION_GATE_DOC_CHARS:-300}
  # 게이트가 점수를 못 얻었을 때의 정책 (#1125). open(기본) | closed.
  SEARCH_REJECTION_GATE_ON_ERROR: ${SEARCH_REJECTION_GATE_ON_ERROR:-open}
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
  # .env 의 programmatic 인증 값을 컨테이너에 주입한다 (#1115).
  # MEMENTO_API_TOKENS 가 우선이고, 비어 있을 때만 ADMIN_API_KEY 가 legacy-admin 으로 합성된다.
  # 둘 다 비면 /tools·/mcp·/messages·/api/v1/* 가 401 로 fail-closed 된다.
  MEMENTO_API_TOKENS: ${MEMENTO_API_TOKENS:-}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  FORGET_WORKING_TTL: ${FORGET_WORKING_TTL:-48}
  FORGET_EPISODIC_TTL: ${FORGET_EPISODIC_TTL:-2160}
  FORGET_SEMANTIC_TTL: ${FORGET_SEMANTIC_TTL:--1}
  FORGET_PROCEDURAL_TTL: ${FORGET_PROCEDURAL_TTL:--1}
  # Docker 컨테이너에서는 반드시 0.0.0.0 — 로컬 .env의 값을 무시하고 고정
  MEMENTO_HTTP_BIND_HOST: "0.0.0.0"
  # MEMENTO_ALLOW_INSECURE_HTTP_ADMIN 은 기본값 false 로 설정됨.
  # 보안 체크 우회가 필요한 경우 uncommitted docker-compose.override.yml 에서만 설정할 것.
  # HTTP MCP dual-era 롤백 게이트 (#840). dual(기본) | legacy | modern.
  # 이 줄이 없으면 .env 에 적어도 컨테이너에 도달하지 않아 롤백 수단이 없다 (#1129).
  MEMENTO_MCP_ERA: ${MEMENTO_MCP_ERA:-dual}
  # SSE 전송 방식 사용 (HTTP/SSE 서버 모드)
  TRANSPORT_TYPE: ${TRANSPORT_TYPE:-sse}

  # ---------------------------------------------------------------------------
  # #1133: env.example 이 문서화한 나머지 설정도 컨테이너에 도달시킨다.
  # 여기 없는 키는 .env 에 적어도 컨테이너에 닿지 않는다. 서버는 코드 기본값으로
  # 조용히 폴백하므로 기동도 헬스체크도 성공한다 — 증상이 없다.
  # 값은 비워 둔다. 빈 값은 «미설정» 으로 읽혀 코드 기본값이 이긴다.
  # compose 에 기본값을 적으면 코드와 두 군데에서 관리하게 되므로 적지 않는다.
  # ---------------------------------------------------------------------------
  # HTTP 서버 · 인증 · 감사
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  MEMENTO_OWNER_SCOPE_MODE: ${MEMENTO_OWNER_SCOPE_MODE:-}
  MEMENTO_HTTP_DEFAULT_AGENT_ID: ${MEMENTO_HTTP_DEFAULT_AGENT_ID:-}
  MEMENTO_HTTP_AUDIT_LOG_PATH: ${MEMENTO_HTTP_AUDIT_LOG_PATH:-}
  MEMENTO_HTTP_AUDIT_MODE: ${MEMENTO_HTTP_AUDIT_MODE:-}
  MEMENTO_HTTP_RATE_LIMIT_TOOLS: ${MEMENTO_HTTP_RATE_LIMIT_TOOLS:-}
  MEMENTO_HTTP_RATE_LIMIT_ADMIN: ${MEMENTO_HTTP_RATE_LIMIT_ADMIN:-}
  MEMENTO_HTTP_RATE_LIMIT_DISABLED: ${MEMENTO_HTTP_RATE_LIMIT_DISABLED:-}
  MEMENTO_RECALL_PROFILE: ${MEMENTO_RECALL_PROFILE:-}
  MEMENTO_BASE_URL: ${MEMENTO_BASE_URL:-}
  MEMENTO_STATIC_ROOT: ${MEMENTO_STATIC_ROOT:-}
  # MCP 도구 노출
  MEMENTO_TOOLSET: ${MEMENTO_TOOLSET:-}
  MEMENTO_TYPE_PARAM_MODE: ${MEMENTO_TYPE_PARAM_MODE:-}
  # 임베딩 · LLM · 검색
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  MEMENTO_FTS5_FALLBACK_ENABLED: ${MEMENTO_FTS5_FALLBACK_ENABLED:-}
  TRIPLE_EXTRACTION_JOB_TIMEOUT_MS: ${TRIPLE_EXTRACTION_JOB_TIMEOUT_MS:-}
  # 보안. 빈 값은 «미설정» 으로 읽혀 코드 기본값 true 가 이긴다 (#1133 에서 pii-masker 수정).
  ENABLE_PII_MASKING: ${ENABLE_PII_MASKING:-}
  # 절차 기억 추출 (#57)
  PROCEDURAL_EXTRACTION_STRATEGY: ${PROCEDURAL_EXTRACTION_STRATEGY:-}
  PROCEDURAL_LLM_EXTRACTOR_TIMEOUT_MS: ${PROCEDURAL_LLM_EXTRACTOR_TIMEOUT_MS:-}
  # 공고화 · 망각
  CONSOLIDATION_SCORE_ENABLED: ${CONSOLIDATION_SCORE_ENABLED:-}
  CONSOLIDATION_MIN_CLUSTER_SIZE: ${CONSOLIDATION_MIN_CLUSTER_SIZE:-}
  CONSOLIDATION_SIMILARITY_THRESHOLD: ${CONSOLIDATION_SIMILARITY_THRESHOLD:-}
  CONSOLIDATION_LOOKBACK_DAYS: ${CONSOLIDATION_LOOKBACK_DAYS:-}
  CONSOLIDATION_MERGE_SIMILARITY_THRESHOLD: ${CONSOLIDATION_MERGE_SIMILARITY_THRESHOLD:-}
  SLEEP_CONSOLIDATION_INTERVAL_MS: ${SLEEP_CONSOLIDATION_INTERVAL_MS:-}
  SOFT_DELETE_GRACE_PERIOD_DAYS: ${SOFT_DELETE_GRACE_PERIOD_DAYS:-}
  FORGETTING_CLEANUP_INTERVAL_MS: ${FORGETTING_CLEANUP_INTERVAL_MS:-}
  CONSOLIDATION_TEST_SEED_PATH: ${CONSOLIDATION_TEST_SEED_PATH:-}
  CONSOLIDATION_BASELINE_PATH: ${CONSOLIDATION_BASELINE_PATH:-}
  CONSOLIDATION_TEST_ITEM_COUNT: ${CONSOLIDATION_TEST_ITEM_COUNT:-}
  # introspection heal (#728)
  INTROSPECTION_HEAL_DEMOTE_FACTOR: ${INTROSPECTION_HEAL_DEMOTE_FACTOR:-}
  INTROSPECTION_HEAL_MIN_IMPORTANCE: ${INTROSPECTION_HEAL_MIN_IMPORTANCE:-}
  INTROSPECTION_HEAL_SOFT_DELETE_IMPORTANCE_THRESHOLD: ${INTROSPECTION_HEAL_SOFT_DELETE_IMPORTANCE_THRESHOLD:-}
  # 텔레메트리 · 감사 로그 보존
  TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-}
  TELEMETRY_CLEANUP_INTERVAL_MS: ${TELEMETRY_CLEANUP_INTERVAL_MS:-}
  TELEMETRY_STORE_QUERY_PLAINTEXT: ${TELEMETRY_STORE_QUERY_PLAINTEXT:-}
  FORGETTING_EVENT_RETENTION_DAYS: ${FORGETTING_EVENT_RETENTION_DAYS:-}
  FORGETTING_EVENT_CLEANUP_INTERVAL_MS: ${FORGETTING_EVENT_CLEANUP_INTERVAL_MS:-}
  # 배치 스케줄러 · 성능 경고
  BATCH_HEALTH_CHECK_INTERVAL_MS: ${BATCH_HEALTH_CHECK_INTERVAL_MS:-}
  BATCH_MONITORING_INTERVAL_MS: ${BATCH_MONITORING_INTERVAL_MS:-}
  BATCH_JOB_PROCESSOR_INTERVAL_MS: ${BATCH_JOB_PROCESSOR_INTERVAL_MS:-}
  MEMORY_REVIEW_CANDIDATES_SCHEDULER_ENABLED: ${MEMORY_REVIEW_CANDIDATES_SCHEDULER_ENABLED:-}
  PERF_MEMORY_WARN_PERCENT: ${PERF_MEMORY_WARN_PERCENT:-}
  PERF_CPU_WARN_PERCENT: ${PERF_CPU_WARN_PERCENT:-}
  PERF_DATABASE_WARN_MB: ${PERF_DATABASE_WARN_MB:-}
  PERF_ALERT_REARM_MS: ${PERF_ALERT_REARM_MS:-}
  # 리뷰 후보 relay PoC (#297)
  MEMENTO_REVIEW_CANDIDATES_CHANGED_RELAY_URLS: ${MEMENTO_REVIEW_CANDIDATES_CHANGED_RELAY_URLS:-}
  MEMENTO_REVIEW_CANDIDATES_CHANGED_RELAY_SECRET: ${MEMENTO_REVIEW_CANDIDATES_CHANGED_RELAY_SECRET:-}

services:
  memento-base:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # HF 게이트웨이 타임아웃 시 빌드만 건너뛰려면 1 (이미지 내 MiniLM 사전 캐시 없음, 런타임 다운로드)
        SKIP_TRANSFORMERS_WARMUP: ${SKIP_TRANSFORMERS_WARMUP:-0}
    environment:
      <<: *default-environment
      # 진단 모드 예시 (필요 시 docker-compose.override.yml 또는 셸 환경변수로 활성화)
      # DIAGNOSTICS_ENABLED: "true"
      # DIAGNOSTICS_INTERVAL_MS: "10000"
      # BATCH_SCHEDULER_ENABLED: "false"
      # WAL_CHECKPOINT_ENABLED: "false"
      # DB_LOCK_MONITOR_ENABLED: "false"
    volumes:
      - ${HOME}/.memento/data:/app/data
      - ${HOME}/.memento/logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s
    stdin_open: true
    tty: true
    # Docker 엔진 내부의 json-file 로그가 무한정 커져서
    # Docker Desktop/daemon 디스크를 고갈시키는 문제를 방지합니다.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
