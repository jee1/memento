  after:  "백업의 -wal 이 비어 있지 않으면 중단 (-shm 은 신호 아님)"
  why: |
    SQLite 는 읽기 전용으로 한 번만 열어도 sidecar 를 만든다. FR-007b 의 구동 검증이
    바로 그렇게 하므로, 존재를 실패로 보면 정상 백업이 게이트에 걸린다.
    비어 있지 않은 -wal 만 위험 신호다 — 부분 복사이거나, 백업 후 누가 붙어서 썼다는 뜻.

