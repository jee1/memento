# Docker 이미지 빌드와 네이티브 의존 스모크 (#996).
#
# 테스트 5900여 건과 type-check 가 전부 초록이어도 이미지 안에서 네이티브 모듈이
# 로드되는지는 아무것도 증명하지 못한다. #993 에서 sharp 0.34 → 0.35 검증이
# 사람 손에 의존했던 공백을 메운다.
#
# paths 필터 때문에 네이티브 의존을 건드리는 PR 에서만 돈다. 나머지 PR 은 영향 없다.

name: Docker Build

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'apps/*/package.json'
      - 'scripts/start-container.sh'
      - 'scripts/docker-smoke.mjs'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  docker-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # MiniLM warmup 을 끄지 않는다. warmup 이 sharp/onnxruntime 경로를 실제로 타는
      # 유일한 지점이라 끄면 검증 가치가 사라진다.
      - name: Build image
        run: docker build -t memento-ci:smoke .

      # 빌드 로그의 warmup 문자열은 grep 하지 않는다 — BuildKit 이 RUN 명령문 텍스트를
      # 그대로 출력해 같은 문자열이 접두어 없이 중복 출현하므로 위양성이 난다.
      # 대신 런타임 오프라인 임베딩으로 확인한다.
      - name: Native dependency smoke
        run: docker run --rm --entrypoint node memento-ci:smoke /app/scripts/docker-smoke.mjs

      # 이미지를 compose 없이 그대로 띄워 EXPOSE·HEALTHCHECK·CMD 가 실제 동작과 맞는지 본다 (#1012).
      # compose 가 PORT·DB_PATH·TRANSPORT_TYPE·MEMENTO_HTTP_BIND_HOST 를 전부 덮어써서
      # 이미지 단독으로는 기동조차 못 하던 상태가 가려져 있었다.
      - name: Standalone boot refuses a non-loopback bind without an API token
        run: |
          if out=$(docker run --rm memento-ci:smoke 2>&1); then
            echo "::error::0.0.0.0 바인딩인데 토큰 없이 기동에 성공했다 (fail-closed 회귀)"
            echo "$out"
            exit 1
          fi
          if ! echo "$out" | grep -q "programmatic API 토큰이 없습니다"; then
            echo "::error::기동은 거부됐지만 사유가 바인드 정책이 아니다"
            echo "$out"
            exit 1
          fi
          echo "토큰 없는 기동이 바인드 정책으로 거부됨 (예상 동작)"

      - name: Standalone container boot
        run: |
          docker run -d --name memento-boot -e ADMIN_API_KEY=ci-smoke memento-ci:smoke
          status=unknown
          for i in $(seq 1 18); do
            status=$(docker inspect -f '{{.State.Health.Status}}' memento-boot)
            if [ "$status" = "healthy" ]; then
              echo "healthy after ~$((i * 10))s"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 10
          done
          echo "::error::컨테이너가 healthy 가 되지 않았다 (status=$status)"
          docker logs memento-boot
          exit 1

      - name: Cleanup standalone container
        if: always()
        run: docker rm -f memento-boot 2>/dev/null || true

      - name: Image size
        if: always()
        run: |
          docker image inspect memento-ci:smoke --format '{{.Size}}' | awk '{printf "image size: %.1f MB\n", $1/1024/1024}'
