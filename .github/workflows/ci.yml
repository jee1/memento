name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install SQLite with VEC extension
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
          # sqlite-vec 확장 설치 시도
          echo "📦 sqlite-vec 설치 시도 중..."
          
          # 방법 1: npm 패키지 설치 시도
          if npm install -g sqlite-vec 2>/dev/null; then
            echo "✅ sqlite-vec 확장 설치 완료 (npm)"
          else
            echo "⚠️ npm 설치 실패, 바이너리 다운로드 시도..."
            
            # 방법 2: 바이너리 다운로드 시도
            if wget -q https://github.com/asg017/sqlite-vec/releases/latest/download/sqlite-vec-linux-x64.tar.gz && \
               tar -xzf sqlite-vec-linux-x64.tar.gz && \
               sudo cp sqlite-vec-linux-x64/sqlite-vec.so /usr/lib/x86_64-linux-gnu/; then
              echo "✅ sqlite-vec 확장 설치 완료 (바이너리)"
            else
              echo "⚠️ sqlite-vec 설치 실패, 기본 SQLite로 계속 진행"
            fi
          fi
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linting
        run: npm run lint -- --max-warnings 0 || echo "Linting completed with warnings"
        
      - name: Check console.log usage
        run: npx tsx scripts/count-console-logs.ts --core-only --ci
        continue-on-error: false

      - name: Check retry usage
        run: npx tsx scripts/archive/check-retry-usage.ts --ci
        continue-on-error: false
        
      - name: Run type checking
        run: npm run type-check
        
      - name: Run tests
        run: npm run test:ci
        env:
          CI: true
          NODE_ENV: test
          SKIP_DB_TESTS: true
          SKIP_INTEGRATION_TESTS: true
        
      - name: Build package
        run: npm run build
        
      # 관계 추출 품질 리포트는 로컬에서만 생성
      # CI 환경에서는 Ollama를 실행할 수 없으므로 스킵
