# CI: 근본적 해결 — 테스트를 패키지별 병렬 job으로 분리해 wall-clock 시간 단축
# (단일 job에서 436+ 테스트 순차 실행 제거, 중복 실행 제거)

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CI: true
  NODE_ENV: test
  SKIP_DB_TESTS: true
  SKIP_INTEGRATION_TESTS: true
  DB_PATH: /tmp/memento-test.db

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --max-warnings 0 || echo "Linting completed with warnings"
      - run: npx tsx scripts/count-console-logs.ts --core-only --ci
        continue-on-error: false
      - run: npx tsx scripts/archive/check-retry-usage.ts --ci
        continue-on-error: false
      - run: npm run type-check
      - name: Audit markdown relative links
        run: npm run docs:audit-links
      - name: Verify npm scripts cited in docs
        run: npm run docs:verify-npm-scripts

  test-root:
    needs: [ lint-typecheck ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install SQLite (optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
      - run: npm ci
      - name: "Run tests (root: src/ + tests/)"
        run: npm run test:ci:root
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-root
          path: test-results/
          retention-days: 7
        continue-on-error: true

  test-core:
    needs: [ lint-typecheck ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install SQLite (optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
      - run: npm ci
      - name: Run tests (packages/memento-core)
        run: npm run test:ci:core
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-core
          path: test-results/
          retention-days: 7
        continue-on-error: true

  test-server:
    needs: [ lint-typecheck ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install SQLite (optional)
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
      - run: npm ci
      - name: Build @memento/agent-integration (required for server resolution)
        run: npm run build -w @memento/agent-integration
      - name: Build @memento/core (required for server test resolution)
        run: npm run build -w @memento/core
      - name: Build memento-server (CLI dist for integration tests)
        run: npm run build -w memento-server
      - name: Run tests (packages/memento-server)
        run: npm run test:ci:server
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-server
          path: test-results/
          retention-days: 7
        continue-on-error: true

  test-client:
    needs: [ lint-typecheck ]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build (core → server → client)
        run: npm run build
      - name: Run tests (@memento/client)
        run: npm run test:ci -w @memento/client
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-client
          path: test-results/
          retention-days: 7
        continue-on-error: true
