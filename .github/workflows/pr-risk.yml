name: PR Risk

# advisory: 라벨과 코멘트만 단다. required check 로 지정하지 않는다.
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited, labeled, unlabeled ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  score:
    # 포크 PR 토큰은 읽기 전용이라 라벨·코멘트를 못 단다.
    # labeled/unlabeled 는 사람이 risk 라벨을 바꾼 경우만 처리한다. 봇의 라벨 편집(GITHUB_TOKEN)은 워크플로를 다시 일으키지 않아 반복되지 않는다.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
      startsWith(github.event.label.name, 'risk:'))
    # 같은 PR 의 실행이 겹치면 라벨 편집이 엇갈리므로 최신 것만 남긴다.
    # job 단위라 위 if 로 건너뛴 실행(무관한 라벨 변경)은 진행 중인 실행을 취소하지 않는다.
    concurrency:
      group: pr-risk-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Score and label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # 이벤트 payload 라벨은 낡을 수 있어 현재 라벨을 다시 읽는다. 점수는 라벨을 올리기만 한다.
          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          node scripts/pr-risk-score.ts --base "$BASE_SHA" --head HEAD --title "$TITLE" --labels "$labels" --json > risk.json
          level=$(jq -r .level risk.json)
          jq -r .markdown risk.json > risk.md
          for l in low medium high; do
            if [ "$l" = "$level" ]; then
              gh pr edit "$PR" --add-label "risk:$l"
            else
              gh pr edit "$PR" --remove-label "risk:$l" 2>/dev/null || true
            fi
          done
          gh pr comment "$PR" --body-file risk.md --edit-last --create-if-none
