# Advisory JS/TS scan via ai-slop-detector. Not a required merge check (#314, #504, #547).
# Triggers: manual + weekly schedule. CI-style review is the PR-quality signal; project
# gate HALT (LDR/DDC) is expected for TS monorepos and remains diagnostic only.

name: Slop detector (JS/TS)

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:15 UTC — low-noise regression signal
    - cron: '15 6 * * 1'

permissions:
  contents: read

concurrency:
  group: slop-js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Advisory: keep default branch green in Actions overview; inspect logs/artifacts on failure.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ai-slop-detector
        run: pip install --progress-bar off 'ai-slop-detector==3.8.5'

      - name: Review repository (CI hard advisory)
        run: |
          set -o pipefail
          slop-detector review . --js --config .slopconfig.yaml --ci-mode hard --no-color 2>&1 | tee slop-review-hard.log

      - name: Scan packages (prod src, JS/TS gate report)
        run: |
          set -o pipefail
          for pkg in memento-core memento-server memento-client; do
            echo "=== packages/$pkg/src ==="
            slop-detector --project "packages/$pkg/src" --js --config .slopconfig.yaml --gate --no-color 2>&1 | tee -a slop-packages-gate.log
          done

      - name: Scan static/js (JS/TS)
        run: |
          set -o pipefail
          slop-detector --project static/js --js --config .slopconfig.yaml --no-color 2>&1 | tee slop-static-js.log

      - name: Upload scan logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: slop-js-logs-${{ github.run_id }}
          path: '*.log'
          retention-days: 14
