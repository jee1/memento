name: Release and Publish

on:
  release:
    types: [published]
  workflow_dispatch: # 수동 실행도 가능

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm run test
        
      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
          
      - name: Update package.json version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          npm version $VERSION --no-git-tag-version
          echo "Updated package.json to version: $VERSION"
          
      - name: Build package
        run: npm run build
        
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## 🚀 Memento MCP Server ${{ github.ref_name }}
            
            ### 📦 npm 패키지
            ```bash
            npx memento-mcp-server@${{ github.ref_name }}
            ```
            
            ### 🔧 설치 방법
            ```bash
            # 최신 버전
            npx memento-mcp-server@latest
            
            # 특정 버전
            npx memento-mcp-server@${{ github.ref_name }}
            ```
            
            ### 📚 문서
            - [README](https://github.com/jee1/memento#readme)
            - [API 문서](https://github.com/jee1/memento/blob/main/docs/ko/api-reference.md)
            - [설치 가이드](https://github.com/jee1/memento/blob/main/INSTALL.md)
            
            ### 🔗 링크
            - [GitHub Repository](https://github.com/jee1/memento)
            - [npm Package](https://www.npmjs.com/package/memento-mcp-server)
          draft: false
          prerelease: false
