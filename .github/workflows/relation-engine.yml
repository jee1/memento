name: Relation Engine CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/domains/relation/**/*.ts'
      - 'src/shared/types/relation*.ts'
      - 'src/infrastructure/database/database/migration/migrations/005-relation-engine-schema.*'
      - 'tests/fixtures/relation_testset.json'
      - 'scripts/generate-relation-report.ts'
      - '.github/workflows/relation-engine.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/domains/relation/**/*.ts'
      - 'src/shared/types/relation*.ts'
      - 'src/infrastructure/database/database/migration/migrations/005-relation-engine-schema.*'
      - 'tests/fixtures/relation_testset.json'
      - 'scripts/generate-relation-report.ts'
      - '.github/workflows/relation-engine.yml'
  workflow_dispatch: # 수동 실행 가능

jobs:
  relation-engine-test:
    name: Relation Engine Tests & Quality Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install SQLite with VEC extension
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
          # sqlite-vec 확장 설치 시도
          echo "📦 sqlite-vec 설치 시도 중..."
          
          # 방법 1: npm 패키지 설치 시도
          if npm install -g sqlite-vec 2>/dev/null; then
            echo "✅ sqlite-vec 확장 설치 완료 (npm)"
          else
            echo "⚠️ npm 설치 실패, 바이너리 다운로드 시도..."
            
            # 방법 2: 바이너리 다운로드 시도
            if wget -q https://github.com/asg017/sqlite-vec/releases/latest/download/sqlite-vec-linux-x64.tar.gz && \
               tar -xzf sqlite-vec-linux-x64.tar.gz && \
               sudo cp sqlite-vec-linux-x64/sqlite-vec.so /usr/lib/x86_64-linux-gnu/; then
              echo "✅ sqlite-vec 확장 설치 완료 (바이너리)"
            else
              echo "⚠️ sqlite-vec 설치 실패, 기본 SQLite로 계속 진행"
            fi
          fi
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run type checking
        run: npm run type-check
        
      - name: Build package
        run: npm run build
        
      - name: Run relation engine unit tests
        run: npm run test -- src/domains/relation/**/*.spec.ts
        continue-on-error: false
        
      - name: Run relation graph tests
        run: npm run test -- src/domains/relation/**/relation-graph*.spec.ts
        continue-on-error: false
        
      - name: Run relation extraction quality integration tests
        run: npm run test -- src/domains/relation/**/relation-extraction-quality.integration.spec.ts
        continue-on-error: false
        env:
          CI: true
          NODE_ENV: test
        
