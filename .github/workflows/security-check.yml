name: Security Check

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop


env:
  # onnxruntime-node의 postinstall은 nuget.org에서 CUDA/TensorRT provider 바이너리를 받는다.
  # 러너에 GPU가 없어 쓰이지 않는데, 이 다운로드가 ETIMEDOUT으로 npm ci를 자주 깨뜨린다 (#890).
  # CPU 런타임(libonnxruntime.so.1, onnxruntime_binding.node)은 패키지에 번들되어 있어 영향 없다.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm ci

      # Production audit gate (#756): runs `npm audit --omit=dev`.
      # Fails when fixable High/Moderate remain. Upstream-blocked ML transitive
      # deps (onnxruntime-node / sharp / adm-zip via @huggingface/transformers)
      # are accepted and documented in docs/reference/{ko,en}/security.md —
      # do NOT add force overrides.
      # 목록에 없는 upstream-blocked 항목이면 실패 — `security/accepted-audit.json` (#942)
      - name: Production npm audit
        run: node scripts/check-production-audit-fixable.mjs

      # Full-tree audit gate (#909): dev 의존성까지 포함해 `npm audit` 를 돌린다.
      # wanted(minor/patch) 범위에서 고칠 수 있는 High/Critical 이 남으면 실패한다.
      # dev moderate(vitest 4→5 major)는 wanted-only 정책상 게이트 대상이 아니다
      # (AGENTS.md deps) — 별도 이슈로 다룬다.
      # 목록에 없는 upstream-blocked 항목이면 실패 — `security/accepted-audit.json` (#942)
      - name: Full npm audit (dev included)
        run: node scripts/check-production-audit-fixable.mjs --include-dev

      # #909: 게이트가 실패해도 전체 목록이 job summary 에 남게 한다.
      - name: npm audit summary
        if: always()
        run: |
          {
            echo '### npm audit (dev 포함)'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Type Check
        run: npm run type-check
      
      - name: ESLint Security Check
        run: npm run lint
        continue-on-error: false
      
      - name: SQL Injection Check
        run: npx tsx scripts/check-sql-injection.ts --ci
        continue-on-error: false
      
      - name: PII Masking Check
        run: npx tsx scripts/check-pii-masking.ts --ci
        continue-on-error: false
      
      - name: Path Traversal Check
        run: npx tsx scripts/check-path-traversal.ts --ci
        continue-on-error: false
      
      - name: Security Unit Tests
        run: |
          npm test -- packages/memento-core/src/shared/utils/logger.spec.ts \
            packages/memento-core/src/shared/utils/__tests__/path-validator.spec.ts \
            packages/memento-core/src/shared/utils/__tests__/pii-masker-env-control.spec.ts
        continue-on-error: false
      
      - name: Security E2E Tests
        run: npx vitest --run packages/memento-server/src/test/security-sql-injection.integration.spec.ts packages/memento-server/src/test/security-path-traversal.integration.spec.ts
        continue-on-error: false
