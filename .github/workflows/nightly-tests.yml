# Weekly: reviewed *.nightly.spec.ts suites and search-quality benchmark

name: Nightly Tests

on:
  schedule:
    # 매주 일요일 02:00 UTC (한국 11:00)
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CI: true
  NODE_ENV: test
  SKIP_DB_TESTS: false
  SKIP_INTEGRATION_TESTS: false
  VITEST_INCLUDE_NIGHTLY: '1'
  DB_PATH: /tmp/memento-nightly-test.db

jobs:
  test-search-quality:
    name: Vector search quality (full env)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
      - run: npm ci
      - name: Run vector search quality benchmark
        run: npm run test:vector-search-quality:ci
      - name: Gate category search quality (MRR >= 0.5)
        run: npm run quality -- benchmark category-report
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-search-quality-results
          path: test-results/
          retention-days: 14
        continue-on-error: true

  test-heavy:
    name: Reviewed heavy suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
      - run: npm ci
      - name: Build @memento/core
        run: npm run build -w @memento/core
      - name: Run reviewed heavy suites
        run: |
          MR_SPEC=packages/memento-core/src/infrastructure/database/sqlite/migration/migration-runner.nightly.spec.ts
          MR_COUNT=$(npx vitest list "$MR_SPEC" 2>/dev/null | grep -c . || true)
          if [ "$MR_COUNT" -eq 0 ]; then
            echo "::error::Expected MigrationRunner nightly tests, got 0"
            exit 1
          fi
          echo "MigrationRunner tests collected: $MR_COUNT"
          npx vitest --run \
            "$MR_SPEC" \
            packages/memento-core/src/infrastructure/database/database-lock-scenarios.nightly.spec.ts \
            packages/memento-core/src/infrastructure/database/database-performance.nightly.spec.ts \
            packages/memento-core/src/domains/memory/services/__tests__/memory-embedding-service.nightly.spec.ts
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-integration-results
          path: test-results/
          retention-days: 14
        continue-on-error: true
