# Weekly: reviewed *.nightly.spec.ts suites and search-quality benchmark

name: Nightly Tests

on:
  schedule:
    # 매주 일요일 02:00 UTC (한국 11:00)
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CI: true
  NODE_ENV: test
  SKIP_DB_TESTS: false
  SKIP_INTEGRATION_TESTS: false
  VITEST_INCLUDE_NIGHTLY: '1'
  DB_PATH: /tmp/memento-nightly-test.db
  # category-report는 DB_PATH가 아니라 tests/fixtures/search-quality/benchmark-v3 를
  # 임시 SQLite에 시드해 측정한다(#905). DB_PATH는 다른 nightly 잡/유틸용.
  EMBEDDING_PROVIDER: minilm
  # onnxruntime-node의 postinstall은 nuget.org에서 CUDA/TensorRT provider 바이너리를 받는다.
  # 러너에 GPU가 없어 쓰이지 않는데, 이 다운로드가 ETIMEDOUT으로 npm ci를 자주 깨뜨린다 (#890).
  # CPU 런타임(libonnxruntime.so.1, onnxruntime_binding.node)은 패키지에 번들되어 있어 영향 없다.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test-search-quality:
    name: Vector search quality (full env)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
      - run: npm ci
      # Xenova/HF 모델(~118MB q8) — category-report·한국어 품질 회귀가 공유 (#928).
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-minilm-${{ hashFiles('packages/memento-core/src/shared/config/embedding-models.ts') }}
          restore-keys: |
            ${{ runner.os }}-hf-minilm-
      # #812 이후 benchmark-search-database가 @memento/core(dist)를 import — build 없으면
      # category-report가 ERR_MODULE_NOT_FOUND로 즉시 실패한다(#905).
      - name: Build @memento/core
        run: npm run build -w @memento/core
      - name: Run vector search quality benchmark
        run: npm run test:vector-search-quality:ci
      - name: Gate category search quality (MRR >= 0.5)
        run: npm run quality -- benchmark category-report
      # #889 한국어 품질 회귀 — opt-in 환경변수 없으면 4 tests skip·exit 0 (#928).
      - name: MiniLM Korean embedding quality
        env:
          RUN_EMBEDDING_QUALITY: '1'
        run: |
          npx vitest --run \
            packages/memento-core/src/domains/embedding/services/__tests__/minilm-korean-quality.spec.ts
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-search-quality-results
          path: test-results/
          retention-days: 14
        continue-on-error: true

  test-heavy:
    name: Reviewed heavy suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev build-essential
      - run: npm ci
      - name: Build @memento/core
        run: npm run build -w @memento/core
      - name: Run reviewed heavy suites
        run: |
          MR_SPEC=packages/memento-core/src/infrastructure/database/sqlite/migration/migration-runner.nightly.spec.ts
          MR_COUNT=$(npx vitest list "$MR_SPEC" 2>/dev/null | grep -c . || true)
          if [ "$MR_COUNT" -eq 0 ]; then
            echo "::error::Expected MigrationRunner nightly tests, got 0"
            exit 1
          fi
          echo "MigrationRunner tests collected: $MR_COUNT"
          npx vitest --run \
            "$MR_SPEC" \
            packages/memento-core/src/infrastructure/database/database-lock-scenarios.nightly.spec.ts \
            packages/memento-core/src/infrastructure/database/database-performance.nightly.spec.ts \
            packages/memento-core/src/domains/memory/services/__tests__/memory-embedding-service.nightly.spec.ts
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-integration-results
          path: test-results/
          retention-days: 14
        continue-on-error: true
