# 검색 랭킹 가중치 설정
# 관계 추론 엔진의 검색 랭킹 공식에 사용되는 가중치 값들
#
# 랭킹 공식(요약): S = α·relevance + β·recency + γ·importance + δ·usage + ζ·relation_weight
#   + ζ_fb·(feedback_norm − 0.5) + θ·process_attribute_fit − ε·duplication_penalty
# (relevance 슬롯에 절차 부스트 등이 합산되는 경우는 구현·스펙 FR-008 참고)

[ranking_weights]
# relevance: 벡터 유사도 기반 관련성 점수
alpha = 0.45

# recency: 최근성 점수 (시간 경과에 따른 감쇠)
beta = 0.20

# importance: 중요도 점수 (importance_score 기반)
gamma = 0.20

# usage: 사용 빈도 점수 (access_count 기반)
delta = 0.10

# relation_weight: 관계 가중치 (관계 그래프 기반)
zeta = 0.15

# duplication_penalty: 중복 패널티 (중복 기억에 대한 감점)
epsilon = 0.10

# theta: 프로세스 속성 적합도(process_attribute_fit) 가중치 (Issue #91, ranking-profiles/default.toml과 동일)
theta = 0.10

# zeta_fb: 피드백 신호(helpful/not_helpful 집계, 시그모이드 정규화 후) 가중치
zeta_fb = 0.05

[relation_weights]
# 관계 가중치 계산 시 정규화를 위한 최대 관계 수
# 이 값보다 많은 관계가 있어도 이 값으로 나누어 정규화
max_relations = 5

# #921: soft length decay on hybrid vector similarity — factor = len/(len+k)
# Applied before HYBRID_VECTOR_THRESHOLD / under-fill / fusion. No create-time gate.
[vector_length_decay]
enabled = true
characteristic_length = 40
# saturation_length: 이 길이 이상이면 감쇠 계수가 1 로 고정된다. factor = min(1, base/norm)
# 없으면 곡선이 1 에 도달하지 못해 아티팩트가 없는 40~200자 구간까지 계속 벌점을 받는다.
saturation_length = 80

# #1079: BM25 rank → relevance 시그모이드의 온도. factor = 1/(1+exp(rank/T))
# T=1 이면 실제 rank 구간(-20~-2)이 전부 포화 꼬리에 들어가 동적 범위가 0.083 으로 뭉갠다.
[fts_relevance]
temperature = 10

# #1082: importance 랭킹 신호를 0.5 중심으로 압축. scaled = 0.5 + (raw - 0.5) * scale
# scale=1 이면 γ·importance 실현 폭이 relevance 를 압도해 benchmark-v3 macro 게이트가 깨진다.
[importance_signal]
scale = 0.35

# #1175: recency 랭킹 신호를 0.5 중심으로 압축. scaled = 0.5 + (raw - 0.5) * scale
# scale=1 이면 β·recency 실현 폭이 α·relevance 를 덮어, 텍스트 레인 1~5위 정답이 융합 top-10 에서 전멸한다.
[recency_signal]
scale = 0.30

# #1180: 융합 relevance 신호를 0.5 중심으로 확장. scaled = 0.5 + (raw - 0.5) * scale
# 압축용인 importance_signal·recency_signal 과 달리 scale 이 1 을 넘을 수 있다.
# 무관 문서도 융합 relevance 가 0.43 수준의 하한을 가져 실현 폭이 좁고, scale=1 이면
# β·recency + γ·importance 의 합이 순위를 정한다 (운영 실측: 정답 relevance 우위 0.0612,
# prior 합 열위 0.0766).
[relevance_signal]
scale = 2.0
