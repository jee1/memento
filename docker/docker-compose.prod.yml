services:
  memento-prod:
    image: memento-prod:latest
    extends:
      file: ../docker-compose.base.yml
      service: memento-base
    environment:
      NODE_ENV: production
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-9001}
      PORT: ${PORT:-9001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${MCP_SERVER_PORT:-9001}:${MCP_SERVER_PORT:-9001}"
    command: ["/app/start-container.sh"]
    networks:
      - memento-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:${MCP_SERVER_PORT:-9001}/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => { process.exit(1); });"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # 443은 SSL 인증서 설정 후 활성화: "443:443"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL 인증서 준비 후 활성화: - ../ssl:/etc/nginx/ssl:ro
    depends_on:
      - memento-prod
    restart: unless-stopped
    networks:
      - memento-network

networks:
  memento-network:
    driver: bridge
