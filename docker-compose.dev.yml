version: '3.8'

services:
  memento-dev:
    extends:
      file: docker-compose.base.yml
      service: memento-base
    environment:
      NODE_ENV: development
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-8080}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${MCP_SERVER_PORT:-8080}:${MCP_SERVER_PORT:-8080}"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    command: ["npm", "run", "dev:http"]
    networks:
      - memento-network

  redis-dev:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - memento-network

volumes:
  redis_dev_data:

networks:
  memento-network:
    driver: bridge
