<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento Dashboard</title>
  <script src="/static/js/memento-admin-config.js"></script>
  <script src="/static/js/memento-admin-fetch.js"></script>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <h1>🎯 Memento Dashboard</h1>
      <div class="header-controls">
        <label for="agent-id-input">Agent ID:</label>
        <input type="text" id="agent-id-input" value="default" placeholder="default">
        <label for="search-query-input">Search:</label>
        <input type="text" id="search-query-input" placeholder="Search memories...">
        <select id="search-slot-select">
          <option value="A" selected>Slot A</option>
          <option value="B">Slot B</option>
          <option value="C">Slot C</option>
        </select>
        <button id="search-btn">Search</button>
        <button id="load-map-btn">Load Map</button>
        <button id="refresh-btn">Refresh</button>
        <button id="clear-search-btn">Clear</button>
        <label for="auto-refresh-toggle" style="margin-left: 1rem;">
          <input type="checkbox" id="auto-refresh-toggle" style="margin-right: 0.25rem;">
          Auto Refresh
        </label>
        <select id="refresh-interval-select" style="margin-left: 0.5rem;">
          <option value="5000">5초</option>
          <option value="10000" selected>10초</option>
          <option value="30000">30초</option>
          <option value="60000">1분</option>
        </select>
      </div>
    </header>

    <div class="tab-bar" role="tablist">
      <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="anchor">Anchor Map</button>
      <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="embedding">Embedding Map</button>
    </div>

    <div id="tab-anchor-map" class="tab-panel active" role="tabpanel">
      <main class="dashboard-main">
        <div class="sidebar">
          <section class="anchor-info">
            <h2>Anchors</h2>
            <div id="anchor-list">
              <p class="no-data">No anchors set</p>
            </div>
          </section>

          <section class="memory-details">
            <h2>Memory Details</h2>
            <div id="memory-details">
              <p class="no-data">Click on a node to view details</p>
            </div>
          </section>
        </div>

        <div class="map-container">
          <div id="anchor-map"></div>
          <div class="map-legend">
            <h3>Legend</h3>
            <div class="legend-item">
              <span class="legend-color anchor-a"></span>
              <span>Slot A (1-hop)</span>
            </div>
            <div class="legend-item">
              <span class="legend-color anchor-b"></span>
              <span>Slot B (2-hop)</span>
            </div>
            <div class="legend-item">
              <span class="legend-color anchor-c"></span>
              <span>Slot C (3-hop)</span>
            </div>
            <div class="legend-item">
              <span class="legend-color memory"></span>
              <span>Memory</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="tab-embedding-map" class="tab-panel" role="tabpanel">
      <div class="embedding-map-layout">
        <div class="em-controls">
          <label>
            Provider
            <select id="em-provider">
              <option value="minilm" selected>minilm</option>
              <option value="tfidf">tfidf</option>
              <option value="openai">openai</option>
              <option value="gemini">gemini</option>
            </select>
          </label>
          <label>
            Limit
            <input id="em-limit" type="number" min="1" max="500" value="300">
          </label>
          <label>
            k
            <input id="em-k" type="number" min="2" max="20" value="6">
          </label>
          <button type="button" id="em-load-btn">Load</button>
          <span id="em-cache-info" class="em-cache-info"></span>
        </div>
        <p class="em-color-legend">
          점 색상은 <strong>K-Means 클러스터</strong>입니다. 같은 색은 UMAP으로 내려온 2D 좌표에서 서로 가까운 임베딩 그룹을 뜻하며, 기억 유형·중요도와는 무관합니다.
        </p>
        <div id="em-loading" class="em-loading hidden">UMAP 계산 중...</div>
        <div id="em-error" class="em-error hidden"></div>
        <div class="embedding-plot-row">
          <div id="em-scatter" class="embedding-scatter-wrap"></div>
          <aside id="em-side-panel" class="em-side-panel" aria-hidden="true"></aside>
        </div>
      </div>
    </div>
  </div>

  <!-- D3.js 라이브러리 (CDN) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <!-- Anchor Map 시각화 스크립트 -->
  <script src="/static/js/anchor-map.js"></script>
  <script src="/static/js/dashboard-tabs.js"></script>
  <script src="/static/js/embedding-map.js"></script>
</body>
</html>
