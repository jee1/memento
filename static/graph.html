<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento Graph View</title>
  <script src="/static/js/memento-admin-fetch.js"></script>
  <script src="/static/js/dashboard-auth-state.js"></script>
  <script src="/static/js/dashboard-auth-dom.js"></script>
  <script src="/static/js/dashboard-auth-render-tabs.js"></script>
  <script src="/static/js/dashboard-auth-render-message.js"></script>
  <script src="/static/js/dashboard-auth-render-form.js"></script>
  <script src="/static/js/dashboard-auth-render-status.js"></script>
  <script src="/static/js/dashboard-auth-render.js"></script>
  <script src="/static/js/dashboard-auth-ui.js"></script>
  <script src="/static/js/dashboard-auth-error.js"></script>
  <script src="/static/js/dashboard-auth-session-check.js"></script>
  <script src="/static/js/dashboard-auth-sign-in.js"></script>
  <script src="/static/js/dashboard-auth-requests.js"></script>
  <script src="/static/js/dashboard-auth.js"></script>
  <script src="/static/vendor/d3.v7.min.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="/static/js/graph-embed-init.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
    }

    body {
      font-family: var(--font-family-base);
      background: var(--color-bg-graph);
      color: var(--color-text-graph);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .graph-view-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    header {
      background: var(--color-graph-surface);
      border-bottom: 1px solid var(--color-border-graph);
      padding: var(--spacing-sm) var(--spacing-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .header-spacer {
      flex: 1 1 auto;
    }

    header h1 {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--color-graph-title);
      white-space: nowrap;
    }

    .graph-auth-panel {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .graph-auth-form,
    .graph-auth-session {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .graph-auth-label,
    .graph-auth-status,
    .graph-auth-message,
    .graph-auth-hint {
      font-size: var(--font-size-xs);
      color: var(--color-graph-text-muted);
    }

    .graph-auth-input {
      width: 200px;
    }

    .graph-action-button {
      padding: 4px 10px;
    }

    .graph-auth-btn-secondary {
      /* m-button--secondary 스타일과 유사하게 유지 */
    }

    .graph-auth-message[data-tone="error"] {
      color: var(--color-graph-auth-error);
    }

    .graph-auth-hint a {
      color: var(--color-graph-link);
    }

    .graph-auth-required {
      display: none;
      margin: var(--spacing-md);
      padding: var(--spacing-md) var(--spacing-lg);
      border: 1px solid var(--color-graph-auth-required-border);
      border-radius: var(--radius-lg);
      background: var(--color-graph-auth-required-bg);
      color: var(--color-graph-detail-text);
      line-height: 1.5;
    }

    .graph-auth-required strong {
      color: var(--color-text-graph);
    }

    .graph-session-only {
      display: none;
    }

    .dashboard-container[data-auth-state="signed-in"] .graph-session-only {
      display: flex;
    }

    .dashboard-container[data-auth-state="signed-in"] .graph-auth-required {
      display: none;
    }

    .dashboard-container[data-auth-state="checking"] .graph-auth-required,
    .dashboard-container[data-auth-state="signed-out"] .graph-auth-required,
    .dashboard-container[data-auth-state="signing-in"] .graph-auth-required,
    .dashboard-container[data-auth-state="signing-out"] .graph-auth-required {
      display: block;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .filter-group label {
      font-size: var(--font-size-xs);
      color: var(--color-graph-text-muted);
      white-space: nowrap;
    }

    .type-checks {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .type-check {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: var(--font-size-xs);
      cursor: pointer;
    }

    .type-check input { cursor: pointer; }

    .importance-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    #importance-slider {
      width: 90px;
      cursor: pointer;
    }

    #importance-val {
      font-size: var(--font-size-xs);
      color: var(--color-graph-text-muted);
      min-width: 28px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    #graph-search {
      width: min(260px, 38vw);
      min-width: 160px;
    }

    #graph-match-badge,
    #graph-mode-hint {
      display: none;
      font-size: var(--font-size-xs);
      color: var(--color-graph-text-muted);
      white-space: nowrap;
    }

    #graph-match-badge {
      border: 1px solid var(--color-border-graph);
      border-radius: var(--radius-sm);
      padding: 2px 7px;
      background: var(--color-graph-surface-elevated);
    }

    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #graph-container {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    svg#graph {
      width: 100%;
      height: 100%;
    }

    /* 빈 상태 메시지 */
    #empty-msg {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--color-graph-text-subtle);
    }

    #empty-msg .icon { font-size: 40px; margin-bottom: var(--spacing-sm); }
    #empty-msg p { font-size: var(--font-size-sm); }

    /* 로딩 */
    #loading {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--color-graph-text-muted);
      font-size: var(--font-size-sm);
    }

    /* 오류 */
    #error-msg {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--color-graph-error);
      font-size: var(--font-size-sm);
    }

    /* 툴팁 */
    #tooltip {
      position: fixed;
      background: var(--color-graph-surface-elevated);
      border: 1px solid var(--color-border-graph);
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) var(--spacing-md);
      font-size: var(--font-size-xs);
      color: var(--color-text-graph);
      pointer-events: none;
      max-width: 260px;
      word-break: break-all;
      display: none;
      z-index: 100;
    }

    /* 상세 패널 */
    #detail-panel {
      width: 300px;
      background: var(--color-graph-surface);
      border-left: 1px solid var(--color-border-graph);
      padding: var(--spacing-md);
      overflow-y: auto;
      display: none;
      flex-shrink: 0;
    }

    #detail-panel h3 {
      font-size: var(--font-size-sm);
      color: var(--color-graph-title);
      margin-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--color-border-graph);
      padding-bottom: var(--spacing-xs);
    }

    .detail-row {
      margin-bottom: var(--spacing-sm);
    }

    .detail-label {
      font-size: var(--font-size-xs);
      color: var(--color-graph-text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: var(--font-size-xs);
      color: var(--color-graph-detail-text);
      word-break: break-word;
      max-height: 150px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .detail-value--mono {
      color: var(--color-graph-text-subtle);
      font-family: monospace;
      font-size: 10px;
    }

    .detail-empty {
      color: var(--color-graph-edge-default);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
    }

    .tag {
      background: var(--color-graph-tag-bg);
      color: var(--color-graph-tag-text);
      border-radius: var(--radius-sm);
      padding: 1px 6px;
      font-size: 11px;
    }

    .type-badge {
      display: inline-block;
      border-radius: var(--radius-sm);
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
    }

    .type-badge--episodic {
      background: var(--color-graph-badge-episodic-bg);
      color: var(--color-graph-badge-episodic-text);
    }

    .type-badge--semantic {
      background: var(--color-graph-badge-semantic-bg);
      color: var(--color-graph-badge-semantic-text);
    }

    .type-badge--procedural {
      background: var(--color-graph-badge-procedural-bg);
      color: var(--color-graph-badge-procedural-text);
    }

    .type-badge--working {
      background: var(--color-graph-badge-working-bg);
      color: var(--color-graph-badge-working-text);
    }

    .type-badge--default {
      background: var(--color-graph-badge-default-bg);
      color: var(--color-graph-badge-default-text);
    }

    /* 범례 */
    #legend {
      position: absolute;
      bottom: var(--spacing-md);
      left: var(--spacing-md);
      background: var(--color-graph-legend-bg);
      border: 1px solid var(--color-border-graph);
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) var(--spacing-md);
      font-size: 11px;
    }

    #legend .legend-title {
      color: var(--color-graph-text-subtle);
      margin-bottom: var(--spacing-xs);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: 3px;
      color: var(--color-graph-text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }

    .legend-dot--episodic {
      background: var(--color-memory-episodic);
    }

    .legend-dot--semantic {
      background: var(--color-memory-semantic);
    }

    .legend-dot--procedural {
      background: var(--color-memory-procedural);
    }

    .legend-dot--working {
      background: var(--color-memory-working);
    }

    /* 노드 스타일 */
    .node circle {
      stroke-width: 2;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .node circle:hover { opacity: 0.85; }

    .node text {
      font-size: 10px;
      fill: var(--color-graph-text-muted);
      pointer-events: none;
      user-select: none;
    }

    /* 엣지 스타일 */
    .link {
      stroke-opacity: 0.55;
    }

    .node.search-dim {
      opacity: 0.18;
    }

    .node.search-match circle {
      stroke: var(--color-graph-title);
      stroke-width: 4;
    }

    .link.search-dim {
      stroke-opacity: 0.12;
    }

    /* Dashboard embed — iframe viewport + Embedding Map 등과 동일한 라이트 패널 스타일 */
    .graph-view--embedded {
      height: 100%;
      --color-bg-graph: var(--color-bg-main);
      --color-text-graph: var(--color-text-main);
      --color-border-graph: var(--color-border-light);
      --color-graph-surface: var(--color-bg-card);
      --color-graph-surface-elevated: var(--color-bg-card);
      --color-graph-title: var(--color-text-main);
      --color-graph-text-muted: var(--color-text-muted);
      --color-graph-text-subtle: var(--color-text-muted);
      --color-graph-detail-text: var(--color-text-main);
      --color-graph-edge-default: var(--color-memory-neutral-stroke);
      --color-graph-legend-bg: var(--color-bg-card);
      --color-graph-tag-bg: var(--color-tab-surface);
      --color-graph-tag-text: var(--color-text-main);
      --color-graph-badge-episodic-bg: var(--color-anchor-c-bg);
      --color-graph-badge-episodic-text: var(--color-anchor-c-stroke);
      --color-graph-badge-semantic-bg: color-mix(in srgb, var(--color-success) 18%, var(--color-bg-card));
      --color-graph-badge-semantic-text: var(--color-success);
      --color-graph-badge-procedural-bg: var(--color-agent-state-degraded-bg);
      --color-graph-badge-procedural-text: var(--color-agent-state-degraded-text);
      --color-graph-badge-working-bg: var(--color-memory-neutral-bg);
      --color-graph-badge-working-text: var(--color-memory-neutral-stroke);
    }

    .graph-view--embedded body {
      height: 100%;
    }

    .graph-view--embedded header h1,
    .graph-view--embedded .graph-auth-panel,
    .graph-view--embedded .graph-auth-required,
    .graph-view--embedded .graph-auth-hint {
      display: none !important;
    }

    .graph-view--embedded header {
      background: var(--color-bg-card);
      border-bottom: 1px solid var(--color-border-light);
      padding: var(--spacing-sm) var(--spacing-md);
      gap: 0.75rem 1rem;
    }

    .graph-view--embedded .filter-group label,
    .graph-view--embedded .type-check,
    .graph-view--embedded #importance-val,
    .graph-view--embedded #graph-match-badge,
    .graph-view--embedded #graph-mode-hint {
      color: var(--color-text-muted);
    }

    .graph-view--embedded #graph-container {
      background: var(--color-bg-card);
      border-top: 1px solid var(--color-border-light);
    }

    .graph-view--embedded #detail-panel {
      background: var(--color-bg-card);
      border-left: 1px solid var(--color-border-light);
      box-shadow: var(--shadow-md);
    }

    .graph-view--embedded #detail-panel h3 {
      color: var(--color-text-main);
      border-bottom-color: var(--color-border-light);
    }

    .graph-view--embedded #legend {
      box-shadow: var(--shadow-sm);
    }

    .graph-view--embedded #tooltip {
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div class="graph-view-container dashboard-container" data-auth-state="checking">
  <header>
    <h1>🕸 Memento Graph View</h1>
    <div class="filter-group graph-session-only">
      <label>타입</label>
      <div class="type-checks">
        <label class="type-check"><input type="checkbox" value="episodic" checked> Episodic</label>
        <label class="type-check"><input type="checkbox" value="semantic" checked> Semantic</label>
        <label class="type-check"><input type="checkbox" value="procedural" checked> Procedural</label>
        <label class="type-check"><input type="checkbox" value="working" checked> Working</label>
      </div>
    </div>
    <div class="filter-group graph-session-only">
      <label>중요도 ≥</label>
      <div class="importance-row">
        <input type="range" id="importance-slider" min="0" max="1" step="0.05" value="0">
        <span id="importance-val">0.0</span>
      </div>
    </div>
    <div class="filter-group graph-session-only">
      <label for="graph-search">검색</label>
      <div class="search-row">
        <input
          id="graph-search"
          class="m-input"
          type="search"
          placeholder="키워드 또는 문장"
          autocomplete="off"
        >
        <button id="search-btn" class="graph-action-button m-button m-button--secondary" type="button">검색</button>
        <span id="graph-match-badge" aria-live="polite"></span>
      </div>
    </div>
    <div class="filter-group graph-session-only">
      <label class="type-check" title="본문을 축약한 전체 그래프 모드로 최대 5,000개 노드를 요청합니다.">
        <input type="checkbox" id="full-graph-toggle"> 전체 로드
      </label>
      <span id="graph-mode-hint"></span>
    </div>
    <button id="apply-btn" class="graph-session-only graph-action-button m-button m-button--primary">필터 적용</button>
    <button id="reset-btn" class="graph-session-only graph-action-button m-button m-button--secondary">초기화</button>
    <div class="header-spacer"></div>
    <section class="graph-auth-panel" aria-label="Graph session">
      <form id="graph-auth-form" class="graph-auth-form">
        <label for="graph-api-key" class="graph-auth-label">Admin API Key</label>
        <input
          type="password"
          id="graph-api-key"
          class="graph-auth-input m-input"
          placeholder="Enter key for /auth/session"
          autocomplete="current-password"
        >
        <button type="submit" id="graph-sign-in-btn" class="graph-action-button m-button m-button--primary">Sign in</button>
      </form>
      <div id="graph-auth-session" class="graph-auth-session" hidden>
        <span id="graph-auth-status" class="graph-auth-status">Session active</span>
        <button type="button" id="graph-sign-out-btn" class="graph-action-button m-button m-button--secondary">Sign out</button>
      </div>
      <p id="graph-auth-message" class="graph-auth-message" aria-live="polite"></p>
      <p class="graph-auth-hint">Full admin UI is available in <a href="/dashboard">/dashboard</a>.</p>
    </section>
  </header>

  <section class="graph-auth-required" aria-live="polite">
    <strong>세션이 필요합니다.</strong> `/graph`는 브라우저 세션이 생긴 뒤에만 그래프를 표시합니다.
    위에서 로그인하거나, 전체 관리 흐름이 필요한 경우 <a href="/dashboard">/dashboard</a>에서 시작하세요.
  </section>

  <div class="main graph-session-only">
    <div id="graph-container">
      <svg id="graph"></svg>

      <div id="loading">⏳ 그래프 로딩 중...</div>
      <div id="error-msg"></div>

      <div id="empty-msg">
        <div class="icon">🧠</div>
        <p>표시할 기억 데이터가 없습니다.<br>필터 조건을 조정하거나 기억을 추가해보세요.</p>
      </div>

      <div id="legend">
        <div class="legend-title">노드 타입</div>
        <div class="legend-item"><span class="legend-dot legend-dot--episodic"></span>Episodic</div>
        <div class="legend-item"><span class="legend-dot legend-dot--semantic"></span>Semantic</div>
        <div class="legend-item"><span class="legend-dot legend-dot--procedural"></span>Procedural</div>
        <div class="legend-item"><span class="legend-dot legend-dot--working"></span>Working</div>
      </div>
    </div>

    <div id="detail-panel">
      <h3>기억 상세</h3>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="tooltip"></div>
  </div>

  <script src="/static/js/graph-shared.js"></script>
  <script src="/static/js/graph-detail.js"></script>
  <script src="/static/js/graph-search.js"></script>
  <script src="/static/js/graph-render.js"></script>
  <script src="/static/js/graph-fetch.js"></script>
  <script src="/static/js/graph.js"></script>
</body>
</html>
