<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento Graph View</title>
  <script src="/static/js/memento-admin-config.js"></script>
  <script src="/static/js/memento-admin-fetch.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3748;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #a78bfa;
      white-space: nowrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-group label {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
    }

    .type-checks {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .type-check {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      cursor: pointer;
    }

    .type-check input { cursor: pointer; }

    .importance-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #importance-slider {
      width: 90px;
      cursor: pointer;
    }

    #importance-val {
      font-size: 12px;
      color: #94a3b8;
      min-width: 28px;
    }

    button {
      padding: 4px 10px;
      border-radius: 5px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }

    #apply-btn {
      background: #7c3aed;
      color: #fff;
    }

    #apply-btn:hover { background: #6d28d9; }

    #reset-btn {
      background: #374151;
      color: #d1d5db;
    }

    #reset-btn:hover { background: #4b5563; }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    svg#graph {
      width: 100%;
      height: 100%;
    }

    /* 빈 상태 메시지 */
    #empty-msg {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #64748b;
    }

    #empty-msg .icon { font-size: 40px; margin-bottom: 8px; }
    #empty-msg p { font-size: 14px; }

    /* 로딩 */
    #loading {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #94a3b8;
      font-size: 14px;
    }

    /* 오류 */
    #error-msg {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #f87171;
      font-size: 14px;
    }

    /* 툴팁 */
    #tooltip {
      position: fixed;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      color: #e2e8f0;
      pointer-events: none;
      max-width: 260px;
      word-break: break-all;
      display: none;
      z-index: 100;
    }

    /* 상세 패널 */
    #detail-panel {
      width: 280px;
      background: #1a1d2e;
      border-left: 1px solid #2d3748;
      padding: 14px;
      overflow-y: auto;
      display: none;
      flex-shrink: 0;
    }

    #detail-panel h3 {
      font-size: 13px;
      color: #a78bfa;
      margin-bottom: 10px;
      border-bottom: 1px solid #2d3748;
      padding-bottom: 6px;
    }

    .detail-row {
      margin-bottom: 8px;
    }

    .detail-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: 12px;
      color: #cbd5e1;
      word-break: break-word;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      background: #312e81;
      color: #a5b4fc;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
    }

    .type-badge {
      display: inline-block;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
    }

    /* 범례 */
    #legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(26,29,46,0.92);
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
    }

    #legend .legend-title {
      color: #64748b;
      margin-bottom: 5px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
      color: #94a3b8;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 노드 스타일 */
    .node circle {
      stroke-width: 2;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .node circle:hover { opacity: 0.85; }

    .node text {
      font-size: 10px;
      fill: #94a3b8;
      pointer-events: none;
      user-select: none;
    }

    /* 엣지 스타일 */
    .link {
      stroke-opacity: 0.55;
    }
  </style>
</head>
<body>
  <header>
    <h1>🕸 Memento Graph View</h1>
    <div class="filter-group">
      <label>타입</label>
      <div class="type-checks">
        <label class="type-check"><input type="checkbox" value="episodic" checked> Episodic</label>
        <label class="type-check"><input type="checkbox" value="semantic" checked> Semantic</label>
        <label class="type-check"><input type="checkbox" value="procedural" checked> Procedural</label>
        <label class="type-check"><input type="checkbox" value="working" checked> Working</label>
      </div>
    </div>
    <div class="filter-group">
      <label>중요도 ≥</label>
      <div class="importance-row">
        <input type="range" id="importance-slider" min="0" max="1" step="0.05" value="0">
        <span id="importance-val">0.0</span>
      </div>
    </div>
    <button id="apply-btn">필터 적용</button>
    <button id="reset-btn">초기화</button>
  </header>

  <div class="main">
    <div id="graph-container">
      <svg id="graph"></svg>

      <div id="loading">⏳ 그래프 로딩 중...</div>
      <div id="error-msg"></div>

      <div id="empty-msg">
        <div class="icon">🧠</div>
        <p>표시할 기억 데이터가 없습니다.<br>필터 조건을 조정하거나 기억을 추가해보세요.</p>
      </div>

      <div id="legend">
        <div class="legend-title">노드 타입</div>
        <div class="legend-item"><span class="legend-dot" style="background:#818cf8"></span>Episodic</div>
        <div class="legend-item"><span class="legend-dot" style="background:#34d399"></span>Semantic</div>
        <div class="legend-item"><span class="legend-dot" style="background:#fb923c"></span>Procedural</div>
        <div class="legend-item"><span class="legend-dot" style="background:#94a3b8"></span>Working</div>
      </div>
    </div>

    <div id="detail-panel">
      <h3>기억 상세</h3>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="tooltip"></div>

  <script src="/static/js/graph.js"></script>
</body>
</html>
