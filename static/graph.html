<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memento Graph View</title>
  <script src="/static/js/memento-admin-fetch.js"></script>
  <script src="/static/js/dashboard-auth.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family-base);
      background: var(--color-bg-graph);
      color: var(--color-text-graph);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid var(--color-border-graph);
      padding: var(--spacing-sm) var(--spacing-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .header-spacer {
      flex: 1 1 auto;
    }

    header h1 {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: #a78bfa;
      white-space: nowrap;
    }

    .graph-auth-panel {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .graph-auth-form,
    .graph-auth-session {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .graph-auth-label,
    .graph-auth-status,
    .graph-auth-message,
    .graph-auth-hint {
      font-size: var(--font-size-xs);
      color: #94a3b8;
    }

    .graph-auth-input {
      width: 200px;
    }

    .graph-auth-btn-secondary {
      /* m-button--secondary 스타일과 유사하게 유지 */
    }

    .graph-auth-message[data-tone="error"] {
      color: #fca5a5;
    }

    .graph-auth-hint a {
      color: #c4b5fd;
    }

    .graph-auth-required {
      display: none;
      margin: var(--spacing-md);
      padding: var(--spacing-md) var(--spacing-lg);
      border: 1px solid #312e81;
      border-radius: var(--radius-lg);
      background: rgba(49, 46, 129, 0.18);
      color: #cbd5e1;
      line-height: 1.5;
    }

    .graph-auth-required strong {
      color: #e2e8f0;
    }

    .graph-session-only {
      display: none;
    }

    .dashboard-container[data-auth-state="signed-in"] .graph-session-only {
      display: flex;
    }

    .dashboard-container[data-auth-state="signed-in"] .graph-auth-required {
      display: none;
    }

    .dashboard-container[data-auth-state="checking"] .graph-auth-required,
    .dashboard-container[data-auth-state="signed-out"] .graph-auth-required,
    .dashboard-container[data-auth-state="signing-in"] .graph-auth-required,
    .dashboard-container[data-auth-state="signing-out"] .graph-auth-required {
      display: block;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .filter-group label {
      font-size: var(--font-size-xs);
      color: #94a3b8;
      white-space: nowrap;
    }

    .type-checks {
      display: flex;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
    }

    .type-check {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: var(--font-size-xs);
      cursor: pointer;
    }

    .type-check input { cursor: pointer; }

    .importance-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    #importance-slider {
      width: 90px;
      cursor: pointer;
    }

    #importance-val {
      font-size: var(--font-size-xs);
      color: #94a3b8;
      min-width: 28px;
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #graph-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    svg#graph {
      width: 100%;
      height: 100%;
    }

    /* 빈 상태 메시지 */
    #empty-msg {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #64748b;
    }

    #empty-msg .icon { font-size: 40px; margin-bottom: var(--spacing-sm); }
    #empty-msg p { font-size: var(--font-size-sm); }

    /* 로딩 */
    #loading {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #94a3b8;
      font-size: var(--font-size-sm);
    }

    /* 오류 */
    #error-msg {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #f87171;
      font-size: var(--font-size-sm);
    }

    /* 툴팁 */
    #tooltip {
      position: fixed;
      background: #1e293b;
      border: 1px solid var(--color-border-graph);
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) var(--spacing-md);
      font-size: var(--font-size-xs);
      color: var(--color-text-graph);
      pointer-events: none;
      max-width: 260px;
      word-break: break-all;
      display: none;
      z-index: 100;
    }

    /* 상세 패널 */
    #detail-panel {
      width: 300px;
      background: #1a1d2e;
      border-left: 1px solid var(--color-border-graph);
      padding: var(--spacing-md);
      overflow-y: auto;
      display: none;
      flex-shrink: 0;
    }

    #detail-panel h3 {
      font-size: var(--font-size-sm);
      color: #a78bfa;
      margin-bottom: var(--spacing-md);
      border-bottom: 1px solid var(--color-border-graph);
      padding-bottom: var(--spacing-xs);
    }

    .detail-row {
      margin-bottom: var(--spacing-sm);
    }

    .detail-label {
      font-size: var(--font-size-xs);
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: var(--font-size-xs);
      color: #cbd5e1;
      word-break: break-word;
      max-height: 150px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
    }

    .tag {
      background: #312e81;
      color: #a5b4fc;
      border-radius: var(--radius-sm);
      padding: 1px 6px;
      font-size: 11px;
    }

    .type-badge {
      display: inline-block;
      border-radius: var(--radius-sm);
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
    }

    /* 범례 */
    #legend {
      position: absolute;
      bottom: var(--spacing-md);
      left: var(--spacing-md);
      background: rgba(26,29,46,0.92);
      border: 1px solid var(--color-border-graph);
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) var(--spacing-md);
      font-size: 11px;
    }

    #legend .legend-title {
      color: #64748b;
      margin-bottom: var(--spacing-xs);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: 3px;
      color: #94a3b8;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }

    /* 노드 스타일 */
    .node circle {
      stroke-width: 2;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .node circle:hover { opacity: 0.85; }

    .node text {
      font-size: 10px;
      fill: #94a3b8;
      pointer-events: none;
      user-select: none;
    }

    /* 엣지 스타일 */
    .link {
      stroke-opacity: 0.55;
    }
  </style>
</head>
<body>
  <div class="graph-view-container dashboard-container" data-auth-state="checking">
  <header>
    <h1>🕸 Memento Graph View</h1>
    <div class="filter-group graph-session-only">
      <label>타입</label>
      <div class="type-checks">
        <label class="type-check"><input type="checkbox" value="episodic" checked> Episodic</label>
        <label class="type-check"><input type="checkbox" value="semantic" checked> Semantic</label>
        <label class="type-check"><input type="checkbox" value="procedural" checked> Procedural</label>
        <label class="type-check"><input type="checkbox" value="working" checked> Working</label>
      </div>
    </div>
    <div class="filter-group graph-session-only">
      <label>중요도 ≥</label>
      <div class="importance-row">
        <input type="range" id="importance-slider" min="0" max="1" step="0.05" value="0">
        <span id="importance-val">0.0</span>
      </div>
    </div>
    <button id="apply-btn" class="graph-session-only m-button m-button--primary" style="padding: 4px 10px;">필터 적용</button>
    <button id="reset-btn" class="graph-session-only m-button m-button--secondary" style="padding: 4px 10px;">초기화</button>
    <div class="header-spacer"></div>
    <section class="graph-auth-panel" aria-label="Graph session">
      <form id="graph-auth-form" class="graph-auth-form">
        <label for="graph-api-key" class="graph-auth-label">Admin API Key</label>
        <input
          type="password"
          id="graph-api-key"
          class="graph-auth-input m-input"
          placeholder="Enter key for /auth/session"
          autocomplete="current-password"
        >
        <button type="submit" id="graph-sign-in-btn" class="m-button m-button--primary" style="padding: 4px 10px;">Sign in</button>
      </form>
      <div id="graph-auth-session" class="graph-auth-session" hidden>
        <span id="graph-auth-status" class="graph-auth-status">Session active</span>
        <button type="button" id="graph-sign-out-btn" class="m-button m-button--secondary" style="padding: 4px 10px;">Sign out</button>
      </div>
      <p id="graph-auth-message" class="graph-auth-message" aria-live="polite"></p>
      <p class="graph-auth-hint">Full admin UI is available in <a href="/dashboard">/dashboard</a>.</p>
    </section>
  </header>

  <section class="graph-auth-required" aria-live="polite">
    <strong>세션이 필요합니다.</strong> `/graph`는 브라우저 세션이 생긴 뒤에만 그래프를 표시합니다.
    위에서 로그인하거나, 전체 관리 흐름이 필요한 경우 <a href="/dashboard">/dashboard</a>에서 시작하세요.
  </section>

  <div class="main graph-session-only">
    <div id="graph-container">
      <svg id="graph"></svg>

      <div id="loading">⏳ 그래프 로딩 중...</div>
      <div id="error-msg"></div>

      <div id="empty-msg">
        <div class="icon">🧠</div>
        <p>표시할 기억 데이터가 없습니다.<br>필터 조건을 조정하거나 기억을 추가해보세요.</p>
      </div>

      <div id="legend">
        <div class="legend-title">노드 타입</div>
        <div class="legend-item"><span class="legend-dot" style="background:#818cf8"></span>Episodic</div>
        <div class="legend-item"><span class="legend-dot" style="background:#10b981"></span>Semantic</div>
        <div class="legend-item"><span class="legend-dot" style="background:#f59e0b"></span>Procedural</div>
        <div class="legend-item"><span class="legend-dot" style="background:#9ca3af"></span>Working</div>
      </div>
    </div>

    <div id="detail-panel">
      <h3>기억 상세</h3>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="tooltip"></div>
  </div>

  <script src="/static/js/graph.js"></script>
</body>
</html>
