version: '3.8'

services:
  memento-prod:
    image: memento-prod:latest
    extends:
      file: docker-compose.base.yml
      service: memento-base
    environment:
      NODE_ENV: production
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-8080}
      PORT: ${PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${MCP_SERVER_PORT:-8080}:${MCP_SERVER_PORT:-8080}"
    command: ["/app/start-container.sh"]
    networks:
      - memento-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MCP_SERVER_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-prod:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - memento-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # 443은 SSL 인증서 설정 후 활성화: "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL 인증서 준비 후 활성화: - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - memento-prod
    restart: unless-stopped
    networks:
      - memento-network

volumes:
  redis_prod_data:

networks:
  memento-network:
    driver: bridge
